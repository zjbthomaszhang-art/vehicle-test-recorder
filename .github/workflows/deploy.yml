name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/,src/,public/,package.json,package-lock.json,vite.config.js,index.html,ecosystem.config.cjs,.github/workflows/deploy.yml"
          target: "~/vehicle-test-recorder"
          strip_components: 0
          overwrite: true

      - name: Build, Restore Env and Force Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/vehicle-test-recorder
            
            # 1. Install and Build
            /usr/bin/npm install
            /usr/bin/npm run build
            
            # 2. Recreate .env with IPv4
            echo "PORT=3001" > .env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "NODE_ENV=production" >> .env
            chmod 600 .env
            
            # 3. CRITICAL: Force kill any process holding port 3001
            echo "Cleaning up port 3001..."
            sudo fuser -k 3001/tcp || true
            /usr/bin/pm2 delete vehicle-recorder || true
            
            # 4. Start fresh
            /usr/bin/pm2 start server/index.cjs --name "vehicle-recorder" --cwd /home/admin/vehicle-test-recorder
            
            # 5. Verify status and logs
            sleep 5
            /usr/bin/pm2 status
            echo "--- Final Server Health Check ---"
            /usr/bin/pm2 logs "vehicle-recorder" --lines 30 --no-daemon & sleep 5 && kill $! || true
