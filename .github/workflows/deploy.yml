name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Only copy the necessary application folders/files to avoid .git permissions issues
          source: "server/,src/,public/,package.json,package-lock.json,vite.config.js,index.html,ecosystem.config.cjs,.github/workflows/deploy.yml"
          target: "~/vehicle-test-recorder"
          strip_components: 0
          overwrite: true

      - name: Build, Diagnose and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            cd ~/vehicle-test-recorder
            
            # 1. Install dependencies and build
            /usr/bin/npm install
            /usr/bin/npm run build
            
            # 2. Database sanity check
            echo "--- Checking Environment ---"
            ls -al .env || echo "MISSING: .env file! Database connection might fail."
            
            # 3. Clean and Restart PM2 with absolute paths
            /usr/bin/pm2 delete vehicle-recorder || true
            /usr/bin/pm2 start server/index.cjs --name "vehicle-recorder" --cwd /home/admin/vehicle-test-recorder
            
            # 4. Final health check
            sleep 5
            /usr/bin/pm2 status
            echo "--- Latest Server Logs ---"
            /usr/bin/pm2 logs "vehicle-recorder" --lines 30 --no-colors | head -n 30
