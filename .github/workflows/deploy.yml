name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/,src/,public/,scripts/,package.json,package-lock.json,vite.config.js,index.html,ecosystem.config.cjs,.github/workflows/deploy.yml,nginx/vehicle-recorder.conf"
          target: "~/vehicle-test-recorder"
          strip_components: 0
          overwrite: true

      - name: NUCLEAR RESTART - RESTORING SYSTEM & NGINX
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/vehicle-test-recorder
            
            # 1. Install Dependencies
            /usr/bin/npm install
            /usr/bin/npm run build
            
            # 2. Recreate .env with IPv4
            echo "PORT=3001" > .env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "NODE_ENV=production" >> .env
            chmod 600 .env

            # Install the daily database backup job for the deployment user.
            chmod 700 scripts/backup_database.sh scripts/install_backup_cron.sh
            scripts/install_backup_cron.sh
            
            # 3. NGINX SETUP: Install and Link Config
            echo "Configuring Nginx..."
            sudo apt-get update
            sudo apt-get install -y nginx
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo cp nginx/vehicle-recorder.conf /etc/nginx/sites-available/vehicle-recorder.conf
            sudo ln -sf /etc/nginx/sites-available/vehicle-recorder.conf /etc/nginx/sites-enabled/vehicle-recorder.conf
            sudo nginx -t
            sudo systemctl restart nginx
            
            # 4. STATIC FILE DEPLOYMENT: Move dist to /var/www for Nginx permissions
            echo "Deploying Static Assets to /var/www/..."
            sudo mkdir -p /var/www/vehicle-test-recorder
            sudo rm -rf /var/www/vehicle-test-recorder/dist
            sudo cp -r dist /var/www/vehicle-test-recorder/
            sudo chown -R www-data:www-data /var/www/vehicle-test-recorder
            
            # 5. ABSOLUTE RESET: Clean PM2 and Ports for Backend
            echo "Executing Aggressive Backend Reset..."
            /usr/bin/pm2 kill || true
            sudo fuser -k 3001/tcp || true
            sudo lsof -t -i:3001 | xargs sudo kill -9 || true
            sudo killall -9 node || true
            
            echo "Waiting for Socket Release (15s)..."
            sleep 15
            
            # 5. Fresh Start (Backend now hidden behind Nginx)
            /usr/bin/pm2 delete "vehicle-recorder" || true
            /usr/bin/pm2 start /home/admin/vehicle-test-recorder/server/index.cjs --name "vehicle-recorder" --cwd /home/admin/vehicle-test-recorder
            
            # 7. Final Health Check
            sleep 5
            /usr/bin/pm2 status
            echo "--- Final Server Health Check (Port 3001) ---"
            /usr/bin/pm2 logs "vehicle-recorder" --lines 30 --no-daemon & sleep 5 && kill $! || true
            
            # 8. Check Nginx Access log for 500s
            echo "Checking Nginx Status..."
            sudo systemctl status nginx --no-pager
