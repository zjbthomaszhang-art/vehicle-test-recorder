server {
    listen 80;
    server_name _;

    # Frontend Static Files (Standard /var/www/ location for better permissions)
    root /var/www/vehicle-test-recorder/dist;
    index index.html;

    # Gzip Compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        # SPA routing: if file not found, serve index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Database Viewer
    location /db-api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /db-viewer {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # API Proxy (Forward requests to Node.js backend)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running save operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
