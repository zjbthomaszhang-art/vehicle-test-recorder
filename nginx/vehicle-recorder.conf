server {
    listen 80;
    server_name _;

    # Frontend Static Files (Standard /var/www/ location for better permissions)
    root /var/www/vehicle-test-recorder/dist;
    index index.html;

    # Allow large image uploads (iPhone photos can be >5MB)
    client_max_body_size 20M;

    # Gzip Compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html: NEVER cache — always fetch latest so new JS/CSS hashes are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # User-uploaded photos — proxy to Node.js backend
    # ^~ stops regex matching so .jpg/.png patterns won't intercept /uploads/*
    location ^~ /uploads {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Hashed static assets (JS/CSS/images): cache 1 year, immutable
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: if file not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Database Viewer
    location /db-api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /db-viewer {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # API Proxy (Forward requests to Node.js backend)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running save operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
